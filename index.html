<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj Analógico Acelerado - Pink Theme</title>
  <!-- Librería p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fce7f3; /* Fondo rosa pastel claro */
      font-family: system-ui, -apple-system, sans-serif;
      color: #831843;
    }
    #controls {
      margin-bottom: 20px;
      background: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      border: 2px solid #f472b6;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15);
      z-index: 10;
    }
    label {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #be185d;
    }
    input[type=range] {
      cursor: pointer;
      accent-color: #ec4899;
    }
    #speedVal {
      font-weight: bold;
      color: #db2777;
      min-width: 45px;
    }
    #canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<div id="controls">
  <label for="speedSlider">Velocidad:</label>
  <input type="range" id="speedSlider" min="1" max="600" value="180" step="1">
  <span id="speedVal">180x</span>
</div>

<div id="canvas-container"></div>

<script>
let angleSec = 0;
let angleMin = 0;
let angleHour = 0;

let slider;
let speedLabel;

function setup() {
  // Crear el lienzo e insertarlo en el contenedor HTML
  let canvas = createCanvas(500, 500);
  canvas.parent('canvas-container');
  angleMode(RADIANS);
  
  slider = document.getElementById('speedSlider');
  speedLabel = document.getElementById('speedVal');
  
  // Sincronizar ángulos iniciales con la hora local real
  let h = hour() % 12;
  let m = minute();
  let s = second();

  angleSec = map(s, 0, 60, 0, TWO_PI);
  angleMin = map(m + s / 60, 0, 60, 0, TWO_PI);
  angleHour = map(h + m / 60 + s / 3600, 0, 12, 0, TWO_PI);
}

function draw() {
  clear(); // Mantiene el fondo limpio en cada render
  
  let speedFactor = parseFloat(slider.value);
  speedLabel.innerText = speedFactor + 'x';
  
  let dt = deltaTime / 1000;
  
  // Velocidades angulares proporcionales (vr3, vr2, vr1)
  let vr3 = (TWO_PI / 60) * speedFactor;          // Segundero
  let vr2 = (TWO_PI / 3600) * speedFactor;        // Minutero
  let vr1 = (TWO_PI / 43200) * speedFactor;       // Horario

  // Actualizar ángulos
  angleSec += vr3 * dt;
  angleMin += vr2 * dt;
  angleHour += vr1 * dt;

  translate(width / 2, height / 2);

  // Resplandor exterior
  noFill();
  stroke(244, 114, 182, 60);
  strokeWeight(16);
  ellipse(0, 0, 420, 420);

  // Marco exterior (Rosa chicle)
  fill('#f472b6');
  stroke('#db2777');
  strokeWeight(5);
  ellipse(0, 0, 390, 390);

  // Esfera central (Rosa pastel)
  fill('#fbcfe8');
  stroke('#f472b6');
  strokeWeight(3);
  ellipse(0, 0, 370, 370);

  for (let i = 0; i < 60; i++) {
    let angle = map(i, 0, 60, 0, TWO_PI);
    let x1 = cos(angle) * 16
